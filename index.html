<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COULDBE | Coming Soon</title>
  <style>
    :root {
      --bg: #feed00;
      --text: #4a7e4a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .wrap {
      display: grid;
      gap: 1rem; /* Zmenšil jsem mezeru mezi logem a textem */
      max-width: 960px;
      padding: 3rem 1.5rem;
      align-items: center;
    }
    h1, h2 {
      text-transform: lowercase;
      line-height: 1; /* Ještě menší řádkování pro kompaktnost */
      margin: 0;
    }
    h1 {
      /* Zvětšil jsem maximální velikost loga a více srazil písmena */
      font-size: clamp(3.5rem, 13vw, 8rem);
      font-weight: 700;
      letter-spacing: -0.05em; 
    }
    h2 {
      /* Zde je hlavní změna: menší font a tenčí řez */
      font-size: clamp(1rem, 3vw, 1.5rem);
      font-weight: 300; /* 300 je tenké, 400 je normální */
      letter-spacing: 0.02em; /* Lehce vzdušnější pro čitelnost malého textu */
      opacity: 0.9; /* Jemné zjemnění barvy */
    }
    .spacer {
      height: 1.5rem;
    }
    .soon {
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>couldbe</h1>
    <h2>shaping what your brands could be</h2>
    <p class="soon">coming soon...</p>
  </main>
</body>
</html>
